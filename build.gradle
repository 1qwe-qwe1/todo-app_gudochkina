import jdk.internal.org.jline.utils.ShutdownHooks

plugins {
    id 'java'
    id 'application'
    id 'com.gradleup.shadow' version '9.2.0'
}

group = 'org.example'
version = findProperty('version') ?: '0.1.0'

sourceCompatibility = '23'
targetCompatibility = '23'

mainClassName = 'org.example.TodoApp'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
    useJUnitPlatform()
}

shadowJar {
    archiveBaseName.set('todo-app')
    archiveClassifier.set('') // no classifier: produce todo-app-<version>.jar
    archiveVersion.set(project.version.toString())
    mergeServiceFiles()
}

tasks.jar {
    enabled = false
}

tasks.named('distZip') { ShutdownHooks.Task it ->
    dependsOn tasks.named('shadowJar')
}

tasks.named('distTar') { ShutdownHooks.Task it ->
    dependsOn tasks.named('shadowJar')
}

tasks.named('startScripts') { ShutdownHooks.Task it ->
    dependsOn tasks.named('shadowJar')
}

tasks.named('startShadowScripts') { ShutdownHooks.Task it ->
    dependsOn tasks.named('jar')
}

tasks.build {
    dependsOn shadowJar
}